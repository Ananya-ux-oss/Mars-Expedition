name: PR Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:

    - name: Copy files to cloud
      uses: actions/checkout@v4


    - name: Install Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'


    - name: Compile all Java files
      run: javac *.java

    - name: Automated Feedback
      if: success()
      run: |
        echo "### 🚀 Automated PR Review Passed" >> $GITHUB_STEP_SUMMARY
        echo "The code has passed compilation and core OOP unit tests." >> $GITHUB_STEP_SUMMARY

    - name: Failure Notification
      if: failure()
      run: echo "❌ PR Review Failed. Check the logs for errors."

    - name: Run Code Check
      run: java MissionControlSystem
