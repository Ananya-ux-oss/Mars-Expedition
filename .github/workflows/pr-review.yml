name: PR Review

on:
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:

    - name: Copy files to cloud
      uses: actions/checkout@v4


    - name: Install Java JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'


    - name: Compile all Java files
      run: javac *.java


    - name: Run Code Check
      run: java MissionControlSystem
